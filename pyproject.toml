[project]
name = "vacv-si"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "kaggle>=2.2.5",
    "lightgbm>=4.7.0",
    "numpy>=2.5.4",
    "pandas>=3.1.1",
    "rdkit>=2026.9.1",
    "requests>=2.34.2",
    "scikit-learn>=1.9.1",
    "six>=1.17.0",
    "tqdm>=4.70.1",
    "xgboost>=3.4.1",
]

[dependency-groups]
dev = [
    "matplotlib>=3.11.2",
    "pytest>=8.4.2",
    "shap>=0.54.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
